name: Publish site

on:
  push:
    branches: [claude/hello-86nrop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept free of an `environment:` block on purpose: the github-pages
  # environment does not exist until Pages is switched on, and a job that
  # names a missing environment is rejected before its steps can run.
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages on
        uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    needs: configure
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
