name: Publish site

on:
  push:
    branches: [claude/hello-86nrop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  # Point GitHub Pages at this branch's root. Once set, Pages rebuilds on
  # every push by itself — no deployment environment, and nothing to switch
  # on by hand in the repository settings.
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Serve this branch on Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          printf '{"source":{"branch":"%s","path":"/"}}' "$BRANCH" > body.json
          echo "Requesting Pages for $REPO on branch $BRANCH"
          if gh api -X POST "repos/$REPO/pages" --input body.json; then
            echo "Pages created."
          else
            echo "Pages already exists — updating its source instead."
            gh api -X PUT "repos/$REPO/pages" --input body.json
          fi
          echo "--- resulting Pages config ---"
          gh api "repos/$REPO/pages" --jq '{status, url: .html_url, branch: .source.branch, path: .source.path}'
